name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 26.08.0)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: just

      - name: Set up runner disk space
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/podman /mnt/buildstream
          sudo chown -R "$USER:$USER" /mnt/podman /mnt/buildstream
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF
          mkdir -p ~/.cache
          ln -sf /mnt/buildstream ~/.cache/buildstream

      - name: Cache ccache for custom kernel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /mnt/buildstream/ccache
          key: ccache-linux-7.2.4-${{ hashFiles('files/installer/linux-chromebook.config') }}
          restore-keys: |
            ccache-linux-7.2.4-

      - name: Validate Element Graph
        run: just validate

      - name: Build and export bootc OCI image
        run: |
          just build-bootc
          just export-bootc

      - name: Build and export bootc installer & target UKI
        run: |
          just build-installer-bootc
          just export-installer-bootc

      - name: Build and export k0s systemd-sysext
        run: |
          just build-sysext
          just export-sysext

      - name: Resolve release version
        id: version
        run: echo "version=$(just version)" >> "$GITHUB_OUTPUT"

      - name: Upload release assets artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: dist/

      - name: Set up podman
        run: |
          sudo mkdir -p /mnt/podman
          sudo chown -R "$USER:$USER" /mnt/podman
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF

      - name: Load bootc image from build artifacts
        run: |
          # The bootc image was exported to podman during build
          # Re-load it from the OCI layout if needed
          if [ -d dist/ddi ]; then
            echo "No DDI in bootc build; image should be in podman"
          fi

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7b6c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push bootc image to GHCR
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Tag the locally built image
          sudo podman tag microraptor:latest "${IMAGE_REGISTRY}/microraptor:${VERSION}"
          sudo podman tag microraptor:latest "${IMAGE_REGISTRY}/microraptor:latest"
          # Push to GHCR
          sudo podman push --compression-format=zstd "${IMAGE_REGISTRY}/microraptor:${VERSION}"
          sudo podman push --compression-format=zstd "${IMAGE_REGISTRY}/microraptor:latest"

  release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: dist/

      - name: Install Secure Boot signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbsigntool

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/microraptor-installer-*.raw.zst dist/microraptor-*.efi dist/release/
          cp dist/sysext/k0s-*.raw.zst dist/release/
          (cd dist/release && sha256sum --binary -- * > SHA256SUMS)
          ls -lh dist/release/

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || needs.build.outputs.version }}"
          PRERELEASE="${{ github.event.inputs.prerelease || false }}"
          if [ -z "${TAG}" ]; then
            echo "ERROR: tag is required" >&2
            exit 1
          fi
          echo "Creating/updating release for tag: ${TAG}"
          gh release create "${TAG}" \
            --title "microraptor v${TAG}" \
            --notes "Automated release for microraptor v${TAG}" \
            --prerelease="${PRERELEASE}" \
            dist/release/* \
            || true
          gh release upload "${TAG}" \
            dist/release/* \
            --clobber