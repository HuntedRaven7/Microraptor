name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 26.08.0)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: just

      - name: Set up runner disk space
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/podman /mnt/buildstream
          sudo chown -R "$USER:$USER" /mnt/podman /mnt/buildstream
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF
          mkdir -p ~/.cache
          ln -sf /mnt/buildstream ~/.cache/buildstream

      - name: Cache ccache for custom kernel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /mnt/buildstream/ccache
          key: ccache-linux-7.2.4-${{ hashFiles('files/installer/linux-chromebook.config') }}
          restore-keys: |
            ccache-linux-7.2.4-

      - name: Validate Element Graph
        run: just validate

      - name: Build and export DDI OS image
        run: |
          just build-ddi
          just export-ddi

      - name: Build and export live installer & target UKI
        run: |
          just build-installer
          just export-installer

      - name: Resolve release version
        id: version
        run: echo "version=$(just version)" >> "$GITHUB_OUTPUT"

      - name: Upload release assets artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: dist/

      - name: Install Secure Boot signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbsigntool

      - name: Prepare Secure Boot signing keys
        if: ${{ secrets.SECUREBOOT_PRIVATE_KEY && secrets.SECUREBOOT_CERTIFICATE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/secureboot
          echo "${{ secrets.SECUREBOOT_PRIVATE_KEY }}" > /tmp/secureboot/key.pem
          echo "${{ secrets.SECUREBOOT_CERTIFICATE }}" > /tmp/secureboot/cert.pem
          chmod 600 /tmp/secureboot/key.pem

      - name: Sign target UKI
        if: ${{ secrets.SECUREBOOT_PRIVATE_KEY && secrets.SECUREBOOT_CERTIFICATE }}
        env:
          SB_KEY: /tmp/secureboot/key.pem
          SB_CERT: /tmp/secureboot/cert.pem
        run: |
          set -euo pipefail
          sbsign --key "$SB_KEY" --cert "$SB_CERT" --output dist/microraptor-26.08.0.efi dist/microraptor-26.08.0.efi

      - name: Sign installer UKI (BOOTX64.EFI in installer image)
        if: ${{ secrets.SECUREBOOT_PRIVATE_KEY && secrets.SECUREBOOT_CERTIFICATE }}
        env:
          SB_KEY: /tmp/secureboot/key.pem
          SB_CERT: /tmp/secureboot/cert.pem
        run: |
          set -euo pipefail
          IMG=$(find dist/ -name 'microraptor-installer-*.raw.zst' | head -n1)
          zstd -d "$IMG" -o /tmp/installer.raw
          LOOP=$(sudo losetup -f --show -P /tmp/installer.raw)
          ESP_PART="${LOOP}p1"
          sudo mkdir -p /tmp/esp
          sudo mount -t vfat "$ESP_PART" /tmp/esp
          sudo sbsign --key "$SB_KEY" --cert "$SB_CERT" --output /tmp/esp/EFI/BOOT/BOOTX64.EFI /tmp/esp/EFI/BOOT/BOOTX64.EFI
          sudo umount /tmp/esp
          sudo losetup -d "$LOOP"
          zstd --rm -T0 -19 -q /tmp/installer.raw -o "$IMG"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/microraptor-installer-*.raw.zst dist/microraptor-*.efi dist/release/
          cp dist/ddi/microraptor-ddi-*.raw.zst dist/release/
          (cd dist/release && sha256sum --binary -- * > SHA256SUMS)
          ls -lh dist/release/

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || needs.build.outputs.version }}"
          PRERELEASE="${{ github.event.inputs.prerelease || false }}"
          if [ -z "${TAG}" ]; then
            echo "ERROR: tag is required" >&2
            exit 1
          fi
          echo "Creating/updating release for tag: ${TAG}"
          gh release create "${TAG}" \
            --title "microraptor v${TAG}" \
            --notes "Automated release for microraptor v${TAG}" \
            --prerelease="${PRERELEASE}" \
            dist/release/* \
            || true
          gh release upload "${TAG}" \
            dist/release/* \
            --clobber
