name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 26.08.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: just

      - name: Set up runner disk space
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/podman /mnt/buildstream
          sudo chown -R "$USER:$USER" /mnt/podman /mnt/buildstream
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF
          mkdir -p ~/.cache
          ln -sf /mnt/buildstream ~/.cache/buildstream

      - name: Build and export DDI OS image
        run: |
          just build-ddi
          just export-ddi

      - name: Build and export live installer & target UKI
        run: |
          just build-installer
          just export-installer

      - name: Build and export k0s systemd-sysext
        run: |
          just build-sysext
          just export-sysext

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/microraptor-installer-*.raw.zst dist/microraptor-*.efi dist/release/
          cp dist/ddi/microraptor-ddi-*.raw.zst dist/release/
          cp dist/sysext/k0s-*.raw.zst dist/release/
          (cd dist/release && sha256sum --binary -- * > SHA256SUMS)
          ls -lh dist/release/

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          PRERELEASE="${{ inputs.prerelease }}"
          if [ -z "${TAG}" ]; then
            echo "ERROR: tag input is required" >&2
            exit 1
          fi
          echo "Creating/updating release for tag: ${TAG}"
          gh release create "${TAG}" \
            --title "microraptor v${TAG}" \
            --notes "Automated release for microraptor v${TAG}" \
            --prerelease="${PRERELEASE}" \
            dist/release/* \
            --clobber
