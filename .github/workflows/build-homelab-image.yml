---
name: Build and Push Homelab Image

# The second image this repository publishes. build-image.yml builds
# Containerfile.workstation and is unchanged; this builds Containerfile.homelab,
# which shares the base, 00-image-info.sh and 90-cleanup.sh with it and has no
# desktop at all.
#
# Why a separate workflow rather than a matrix row in build-image.yml:
#
#   IMAGE_NAME differs, and it is derived, not chosen. build-image.yml takes it
#   from github.event.repository.name, which is the right rule for a repository
#   whose one image is named after the repository. This repository has two, so
#   the homelab image's name is set literally here and the workstation's stays
#   derived. Deriving both from one expression would mean the workstation image
#   silently changed name the day a second image was added.
#
#   The tag stream is the same, so both images publish :stable-testing from main
#   and are promoted by the same execute-release.yml. See "Release model" below.
#
# Release model:
#   main   = testing branch, publishes :stable-testing and :testing.
#   stable = production, receives the signed digest through execute-release.yml.
#
# On promotion: execute-release.yml promotes by repository, not by image, and
# today resolves one candidate digest. Once this image is being promoted, that
# workflow needs an input naming which image it is promoting, or the homelab
# release silently stops being promoted. That is the one piece of work this
# workflow deliberately does NOT do here -- see the note in execute-release.yml.
#
# Builds run on push to main only; PR builds are disabled, matching
# build-image.yml. A change to a workflow the build depends on still builds.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # Literal, not github.event.repository.name. See the header: the workstation
  # image is named after the repository and this one is not.
  IMAGE_NAME: "microraptor-homelab"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_FLAVOR: "homelab"
  DEFAULT_TAG: "stable"
  PRODUCTION_BRANCH: "stable"
  REGISTRY_CACHE_WRITE: "1"
  ENABLE_RECHUNKING: "false"
  RECHUNK_MAX_LAYERS: "128"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  identify:
    runs-on: ubuntu-24.04
    outputs:
      tag_stream: ${{ steps.stream.outputs.tag_stream }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve tag stream
        id: stream
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "${PRODUCTION_BRANCH}" ]]; then
            echo "tag_stream=stable" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_stream=testing" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: identify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        uses: projectbluefin/actions/bootc-build/dnf-cache@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          action: restore
          cache-name: ${IMAGE_NAME}
          # Scoped to this image's own Containerfile, not **/Containerfile.*. The
          # two images share a base and 90-cleanup.sh, so a change to the
          # workstation Containerfile should not invalidate this image's dnf
          # cache -- and vice versa. This is the one place the two images'
          # caches should be kept apart.
          cache-bust: ${{ hashFiles('Containerfile.homelab', 'build/2*-server-*.sh', 'build/30-k0s.sh', 'build/35-kc-agent.sh') }}

      - name: Build image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          # `build` with the flavour as its third argument, NOT `build-homelab`.
          #
          # The wrapper recipe would shell out to `just` by name, and under
          # `sudo -E` a recipe inherits sudo's reset PATH rather than the one
          # "$(command -v just)" was resolved from -- so the nested call fails
          # with "sh: 1: just: not found" and exit 127. Passing the flavour
          # directly keeps CI to a single just invocation, which is the same reason
          # build-image.yml calls `build` with two arguments.
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}" homelab

      - name: Get version label
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ needs.identify.outputs.tag_stream }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}

      - name: Finalize branch tags
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
          TAG_STREAM: ${{ needs.identify.outputs.tag_stream }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            if [[ "${TAG_STREAM}" == "testing" ]]; then
              # Bare :testing stays so the promotion release gate can resolve it.
              [[ "${tag}" == "testing" ]] && add_tag "${tag}"
              add_tag "${tag/testing/stable-testing}"
            else
              add_tag "${tag}"
            fi
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Save DNF cache
        if: always() && !cancelled()
        uses: projectbluefin/actions/bootc-build/dnf-cache@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          action: save
          cache-name: ${IMAGE_NAME}
          allow-write: "true"
          cache-bust: ${{ hashFiles('Containerfile.homelab', 'build/2*-server-*.sh', 'build/30-k0s.sh', 'build/35-kc-agent.sh') }}

      # No rootful-load step here, and that is deliberate: build-image.yml does
      # not have one either, and podman push is done by the upstream
      # push-image action rather than by the local `just` recipes. Adding a load
      # step would only duplicate what that action already does from the
      # rootless image just built.
      - name: Tag images
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.branch-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # Every build here is a candidate build from main and publishes tags.
      # execute-release.yml promotes the signed, gated candidate digest to
      # :stable without a stable-branch rebuild, so the upstream push-image
      # action owns all registry authentication and pushing. This is why the
      # step below is push-image rather than the older push action: it returns
      # the digest that sign-and-publish has to sign.

      - name: Push to GHCR
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.branch-tags.outputs.tags }}
          default-tag: ${{ steps.branch-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Keyless OIDC signing via Fulcio, matching build-image.yml. Requires the
      # id-token: write permission granted at the top.
      #
      # Signing failures do not block candidate publication, but the release gate
      # rejects an unsigned candidate and preserves the prior :stable.
      - name: Sign and publish
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@a52da5670b9337598cbc80c4d6a9a7b21e770aec # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          # Scoped with github.repository, not repository_owner, for the reason
          # the ci skill records: matching the owner accepts a signature minted
          # by any repository in the org.
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Flavor:** homelab (Containerfile.homelab)"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo ""
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"