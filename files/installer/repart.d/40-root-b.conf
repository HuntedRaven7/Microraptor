# Root partition — slot B
# systemd-repart copies the DDI payload block-for-block from the embedded
# installer data partition on the boot medium, same as root-a.
[Partition]
Type=root
Label=Microraptor-root-b
CopyBlocks=/dev/disk/by-partlabel/microraptor-installer-data
SizeMinBytes=4G
SizeMaxBytes=20G
GrowFileSystem=yes
