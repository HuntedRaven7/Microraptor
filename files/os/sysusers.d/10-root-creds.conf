# Root and core accounts are created here by systemd-sysusers on first boot.
# root's password is provisioned at first boot as a systemd credential:
# microraptor-cred-provision.service seals a generated hash to the local TPM2
# into /etc/credstore.encrypted/ (passwd.hashed-password.root), or writes a
# plaintext credential store entry on systems without a TPM2 device.
# Without the credential the account is created locked, i.e. no login.
g root 0
g wheel 998
u core 1000 "core" /home/core /bin/sh
u root 0 "root" /root /bin/sh