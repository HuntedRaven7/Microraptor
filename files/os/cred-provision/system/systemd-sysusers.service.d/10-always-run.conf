# Image-first flow: /etc/.updated vs /usr timestamp comparison is not a reliable
# first-boot signal across DDI rebuilds, and a skipped sysusers run means no
# system users exist at all (bricked console login, broken networkd/polkit).
# systemd-sysusers is idempotent, so run it on every boot instead of gating on
# the update/credential conditions.
[Unit]
ConditionNeedsUpdate=
ConditionCredential=
